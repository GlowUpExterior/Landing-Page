<H1>Hello, world!</H1>
<p>This is the customer's first impression when viewing our site. It needs to be good. </p>


<!-- Your standard HTML Form -->
<form id="contactForm">
  <input type="text" id="name" placeholder="Your Name" required>
  <input type="email" id="email" placeholder="Your Email" required>
  <textarea id="message" placeholder="Your Message" required></textarea>
  <button type="submit" id="submitBtn">Send Message</button>
</form>

<div id="formResponse" style="display:none;"></div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault(); // Stop page reload
  
  const submitBtn = document.getElementById('submitBtn');
  const responseDiv = document.getElementById('formResponse');
  
  submitBtn.disabled = true;
  submitBtn.innerText = "Sending...";
  
  // Package form data into a clean JSON object
  const formData = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    message: document.getElementById('message').value
  };

  // REPLACE THIS URL with your actual Google Web App URL from Step 2
  const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbyYCYTfynRM1EAcHY9ABtYgiq6jytbdqm3Yvd2ZYvsC05679DppwWZLYznbk1LrutZp/exec';

  fetch(googleScriptUrl, {
    method: 'POST',
    mode: 'no-cors', // Bypasses browser security locks for external script submissions
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(formData)
  })
  .then(() => {
    // With 'no-cors', we safely assume a completed request is a success
    responseDiv.style.display = 'block';
    responseDiv.style.color = 'green';
    responseDiv.innerText = 'Thank you! Your message has been sent.';
    document.getElementById('contactForm').reset();
  })
  .catch(error => {
    responseDiv.style.display = 'block';
    responseDiv.style.color = 'red';
    responseDiv.innerText = 'Oops! Something went wrong. Please try again.';
    console.error('Error:', error);
  })
  .finally(() => {
    submitBtn.disabled = false;
    submitBtn.innerText = "Send Message";
  });
});
</script>
